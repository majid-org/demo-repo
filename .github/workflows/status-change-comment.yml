name: Track Project Status Changes

on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'  # every 30 minutes

jobs:
  track-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install @octokit/graphql node-fetch

      - name: Run status change checker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node check-status.mjs
